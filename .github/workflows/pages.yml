name: Publicar panel de ocupación
on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - data/ocupacion.csv
      - data/latest.json
      - data/archivo/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar sitio estático
        id: deployment
        uses: actions/deploy-pages@v4
