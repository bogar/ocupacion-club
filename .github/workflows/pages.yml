name: Publicar panel de ocupación
on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      # Los CSV/JSON se leen directamente de la rama main en el navegador.
      # No se reconstruye Pages por cada lectura de Proxmox.
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      artifact_name: ${{ steps.name.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Identificar artefacto
        id: name
        run: echo "value=github-pages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: ${{ steps.name.outputs.value }}
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Esperar a que el artefacto esté visible en la API
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
        run: |
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" --jq '.total_count') || count=0
            if [ "$count" = 1 ]; then exit 0; fi
            sleep 5
          done
          echo "::error::No se encontró un artefacto único para este intento"
          exit 1
      - name: Publicar sitio estático
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
